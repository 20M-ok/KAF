# Configuration for the voice module
# Rename this file to `config.yaml` and fill in your credentials.

# Google Cloud Speech-to-Text credentials
GOOGLE_APPLICATION_CREDENTIALS: path/to/google_credentials.json

# Amazon Web Services credentials for Polly
AWS_ACCESS_KEY_ID: your-aws-access-key
AWS_SECRET_ACCESS_KEY: your-aws-secret-key
AWS_REGION: us-east-1
POLLY_VOICE_ID: Joanna
